name = "rootask"
main = "worker/src/index.ts"
compatibility_date = "2024-10-22"

# 前端（web/dist）與 Worker 同網域部署；/api 與 /auth 先交給 Worker 處理
[assets]
directory = "./web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/auth/*"]

[vars]
# GitHub App 的網址代稱（https://github.com/apps/<slug>），用來產生「安裝到 repo」連結
GITHUB_APP_SLUG = "rootask"

# 以下為機密，請用 `wrangler secret put <名稱>` 設定，不要寫在這裡：
#   GITHUB_CLIENT_ID
#   GITHUB_CLIENT_SECRET
#   SESSION_SECRET   （任意 32 字元以上的亂數字串）
#   WEBHOOK_SECRET   （與 GitHub App 設定的 webhook secret 相同）
