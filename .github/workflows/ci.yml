name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # 介面自動化測試（#51）：建置後的前端＋假 GitHub
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: 上傳失敗的截圖與追蹤
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - run: npx wrangler deploy --dry-run -c local.example/wrangler.toml --outdir /tmp/worker-dry

  # main 上的檢查通過後自動部署。沒設 CLOUDFLARE_API_TOKEN 的 repo（例如別人的 fork）會跳過。
  # 設定方式見 docs/SETUP.md「自動部署」。
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # 同時只跑一個部署，新的會等舊的跑完
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Secrets 或 Variables 都可以
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: ${{ vars.WORKER_NAME }}
      # GitHub 不允許 GITHUB_ 開頭的變數名稱，所以用 ROOTASK_ 前綴
      ROOTASK_APP_ID: ${{ vars.ROOTASK_APP_ID }}
      ROOTASK_APP_SLUG: ${{ vars.ROOTASK_APP_SLUG }}
    steps:
      - name: 檢查是否已設定自動部署
        id: enabled
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$WORKER_NAME" ]; then
            echo "::notice::沒有設定 CLOUDFLARE_API_TOKEN 或 WORKER_NAME，跳過自動部署"
            echo "on=false" >> "$GITHUB_OUTPUT"
          else
            echo "on=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.enabled.outputs.on == 'true'
        uses: actions/checkout@v4
      - if: steps.enabled.outputs.on == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.enabled.outputs.on == 'true'
        run: npm ci
      - if: steps.enabled.outputs.on == 'true'
        name: 產生部署設定
        run: node scripts/ci-config.mjs
      - if: steps.enabled.outputs.on == 'true'
        name: 部署
        # Worker 上已設定的 secret（client secret、私鑰等）不受影響
        run: npm run build && npx wrangler deploy -c local/wrangler.toml
